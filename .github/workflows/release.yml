name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$cargo_version" ]; then
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: package
        run: scripts/package.sh "${{ needs.check.outputs.version }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    outputs:
      checksums: ${{ steps.sums.outputs.checksums }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: sums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
          {
            echo "checksums<<EOF"
            cat checksums.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  homebrew:
    name: update homebrew tap
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yungibly/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: render formula
        env:
          CHECKSUMS: ${{ needs.release.outputs.checksums }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          sum() { echo "$CHECKSUMS" | grep " cubby-$VERSION-$1.tar.gz\$" | cut -d' ' -f1; }
          mkdir -p tap/Formula
          scripts/formula.sh "$VERSION" \
            "$(sum aarch64-apple-darwin)" \
            "$(sum x86_64-apple-darwin)" \
            "$(sum aarch64-unknown-linux-musl)" \
            "$(sum x86_64-unknown-linux-musl)" \
            > tap/Formula/cubby.rb
          cat tap/Formula/cubby.rb
      - name: push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cubby.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "cubby ${{ needs.check.outputs.version }}"
          git push
